# The gate on every PR and every push to main. The main ruleset requires the `gate` check, so a red
# gate cannot merge. Actions are pinned to commit SHAs (the repo enforces it); Dependabot bumps them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm run install:all
      - run: npm run gate
