# Push a v* tag to publish ghcr.io/zacgoodwin/scp:<version> (and :latest for non-prerelease tags).
# The tag must match VERSION (scripts/release-tag.mts), so an image is never labelled with a version
# the code does not claim. The gate runs in its own job with a read-only token: npm install scripts
# never see a token that can push packages.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      # Node 24 strips types natively, so this needs no install step first.
      - run: node scripts/release-tag.mts "$GITHUB_REF_NAME"
      - run: npm run install:all
      - run: npm run gate

  image:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ponytail: flavor latest=auto (the default) skips prereleases but still moves :latest on a
      # backport tag (v0.1.2 after v0.2.0); compare against the highest released tag if backports start.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/zacgoodwin/scp
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
